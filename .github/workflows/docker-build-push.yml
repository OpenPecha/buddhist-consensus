name: Build, Push, and Deploy to ECS Fargate

on:
  push:
    branches:
      - fix/combine-search-chat
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/t8u7n5a4
  IMAGE_NAME: webuddhist-ai-api
  ECS_CLUSTER_NAME: webuddhist-ai-cluster
  ECS_SERVICE_NAME: webuddhist-ai-task-service
  ECS_TASK_DEFINITION: webuddhist-ai-task

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Tag Docker image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image to ECR Public
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      - name: Update image in task definition
        run: |
          # Update the image URI in the task definition
          python3 << EOF
          import json
          import sys
          
          with open('task-definition.json', 'r') as f:
              task_def = json.load(f)
          
          # Update the image for the container
          for container in task_def.get('containerDefinitions', []):
              if container['name'] == 'webuddhist-ai-api':
                  container['image'] = '${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
                  break
          
          # Remove fields that shouldn't be in register-task-definition
          task_def.pop('taskDefinitionArn', None)
          task_def.pop('revision', None)
          task_def.pop('status', None)
          task_def.pop('requiresAttributes', None)
          task_def.pop('compatibilities', None)
          task_def.pop('registeredAt', None)
          task_def.pop('registeredBy', None)
          
          with open('task-definition.json', 'w') as f:
              json.dump(task_def, f, indent=2)
          EOF

      - name: Register new task definition revision
        id: task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-def-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Check if service exists
        id: check-service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          
          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            echo "service-exists=true" >> $GITHUB_OUTPUT
            echo "✓ Service exists and is ACTIVE"
          else
            echo "service-exists=false" >> $GITHUB_OUTPUT
            echo "✗ Service does not exist or is not ACTIVE"
            echo "Status: $SERVICE_STATUS"
          fi

      - name: Create ECS service (if not exists)
        if: steps.check-service.outputs.service-exists != 'true'
        run: |
          echo "::warning::ECS service does not exist. Attempting to create it..."
          echo "Note: This requires VPC, subnet, and security group configuration."
          echo "If this fails, please create the service manually via AWS Console."
          echo ""
          
          # Try to get default VPC and subnets
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
          
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "::error::No default VPC found. Please create the ECS service manually."
            echo "See AWS_SETUP_INSTRUCTIONS.md for detailed steps."
            exit 1
          fi
          
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[*].SubnetId' \
            --output text | tr '\t' ' ' | tr ' ' ',' | sed 's/,$//')
          
          if [ -z "$SUBNET_IDS" ]; then
            echo "::error::No subnets found in VPC. Please create the ECS service manually."
            exit 1
          fi
          
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=default" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null)
          
          if [ -z "$SECURITY_GROUP_ID" ] || [ "$SECURITY_GROUP_ID" = "None" ]; then
            echo "::error::No default security group found. Please create the ECS service manually."
            exit 1
          fi
          
          echo "Creating service with:"
          echo "  VPC: $VPC_ID"
          echo "  Subnets: $SUBNET_IDS"
          echo "  Security Group: $SECURITY_GROUP_ID"
          echo ""
          
          # Convert subnet IDs to array format for AWS CLI
          SUBNET_ARRAY=$(echo $SUBNET_IDS | tr ',' ' ')
          FIRST_SUBNET=$(echo $SUBNET_ARRAY | cut -d' ' -f1)
          SECOND_SUBNET=$(echo $SUBNET_ARRAY | cut -d' ' -f2)
          
          if [ -z "$SECOND_SUBNET" ]; then
            SUBNET_CONFIG="subnets=[$FIRST_SUBNET]"
          else
            SUBNET_CONFIG="subnets=[$FIRST_SUBNET,$SECOND_SUBNET]"
          fi
          
          aws ecs create-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service-name ${{ env.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.task-def.outputs.task-def-arn }} \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={$SUBNET_CONFIG,securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
            --platform-version LATEST
          
          echo "✓ Service created successfully!"

      - name: Update ECS service (if exists)
        if: steps.check-service.outputs.service-exists == 'true'
        run: |
          echo "Updating existing ECS service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service ${{ env.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.task-def.outputs.task-def-arn }} \
            --force-new-deployment
          echo "✓ Service update initiated"

      - name: Wait for service stability
        run: |
          echo "Waiting for service to stabilize (this may take a few minutes)..."
          # The wait command will poll every 15 seconds with a default timeout
          # We'll use a background process with timeout to limit total wait time
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} || {
            echo "::warning::Service stability check completed or timed out"
            echo "Checking current service status..."
            aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_NAME }} \
              --services ${{ env.ECS_SERVICE_NAME }} \
              --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,Deployments:deployments[*].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount}}' \
              --output table
            # Don't fail - deployment may still be progressing
            exit 0
          }
          echo "✓ Service is stable!"

